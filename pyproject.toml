[tool.poetry]
name = "coin-purse"
version = "0.1.0"
description = ""
authors = ["Evan Young <cantis@gmail.com>"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.103.1"
pydantic = {extras = ["email"], version = "^2.4.2"}
sqlalchemy = "^2.0.23"
sqlmodel = "^0.0.19"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.2"
uvicorn = "^0.23.2"
ruff = "^0.1.5"
alembic = "^1.12.1"
httpx = "^0.25.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
fix = true
src = ["src/*", "tests"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["S101", "ARG001", "ANN001", "ANN101"]

[tool.pytest.ini_options]
# -ra is for showing the output of the tests that failed
# -q is for quiet mode
addopts = "-ra"
# this adds the project root and the src directory to the path for the tests
pythonpath = ["src", "."]
# this sets the testpaths to the tests directory
testpaths = ["tests"]
